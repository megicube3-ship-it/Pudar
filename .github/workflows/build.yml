name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
      - name: find project and build
        run: |
          echo "Isi repo:"
          find . -path ./.git -prune -o -type f -print | head -60
          SETTINGS=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle TIDAK ditemukan di repo"
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          gradle build --no-daemon
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: '**/build/libs/*.jar'

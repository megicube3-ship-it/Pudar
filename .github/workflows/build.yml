name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
      - name: extract zip and build
        run: |
          unzip -o wetblocks-mod.zip -d proj
          echo "Isi proyek:"
          find proj -type f | head -40
          SETTINGS=$(find proj -name settings.gradle | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle TIDAK ditemukan di zip"
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          gradle build --no-daemon
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: 'proj/**/build/libs/*.jar'

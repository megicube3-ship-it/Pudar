name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - name: Build
        run: |
          F=$(find . -name build.gradle -not -path './.git/*' | head -n1)
          if [ -z "$F" ]; then
            echo "build.gradle TIDAK ditemukan. Isi repo:"
            ls -R | head -50
            exit 1
          fi
          D=$(dirname "$F")
          echo "Project ada di: $D"
          cd "$D"
          gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bloodnparticles-client
          path: "**/build/libs/*.jar"
